# ponytail: Minimum docker-compose specification for pgvector and redis.
# Upgrade path: add multi-node clustering and monitoring exporter services.
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: numm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-numm_master}
      POSTGRES_USER: ${POSTGRES_USER:-numm_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-numm_secure_pass}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-numm_admin} -d ${POSTGRES_DB:-numm_master}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: numm_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
  redisdata:
