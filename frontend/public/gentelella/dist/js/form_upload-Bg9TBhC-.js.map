
      const dz = document.getElementById('dz');
      ['dragenter', 'dragover'].forEach(e =>
        dz.addEventListener(e, ev => {
          ev.preventDefault();
          dz.classList.add('over');
        })
      );
      ['dragleave', 'drop'].forEach(e =>
        dz.addEventListener(e, ev => {
          ev.preventDefault();
          dz.classList.remove('over');
        })
      );
