<link rel="icon" href="../images/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

<body data-shell="admin" data-page="pages" data-breadcrumb="Home > Ecosystem Sharing > Surplus Stock Listing">

<main class="main">
<div class="page-wrapper">

  <div class="page-header">

      <div>
        <div class="page-pretitle">National Unified Material Master · Search Before Buy</div>

      </div>
      <div class="page-actions">
        <a href="tables.html" class="btn btn-outline">View CVC Audit Trail</a>

          Launch Search Before Buy
        </a>
      </div>
    </div>
  </div>

  <!-- Filter bar -->
  <div class="card" style="margin-bottom:16px">
    <div class="card-body" style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px 16px">
      <span style="font-size:12px;color:var(--text-muted);font-weight:var(--font-weight-medium)">Filter:</span>
      <span class="chip chip-primary active">Valves &amp; Actuators<button type="button" class="chip-close" aria-label="Remove Valves">×</button></span>
      <span class="chip">Piping &amp; Flanges</span>
      <span class="chip">Gaskets &amp; Fasteners</span>
      <span class="chip">Instrumentation</span>
      <span class="chip">Motors &amp; Rotating</span>
      <span class="chip chip-yellow active">ONGC Surplus<button type="button" class="chip-close" aria-label="Remove ONGC">×</button></span>
      <span class="chip chip-green active">IOCL Surplus<button type="button" class="chip-close" aria-label="Remove IOCL">×</button></span>
      <span style="margin-left:auto;font-size:12px;color:var(--text-muted)">4,210 Active National Spares</span>
      <select class="form-control" style="width:160px;height:32px" aria-label="Sort orders">
        <option>Sort: Nearest Plant</option>
        <option>Sort: Highest Stock</option>
        <option>Sort: Unit Value ↓</option>
        <option>Sort: ONMC Code</option>
      </select>
    </div>
  </div>

  <div class="row col-3" id="products-grid"></div>

</div>
