<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NUMM Material Master</title>
    <link rel="icon" href="../images/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script type="module">import "/src/main-v4.js";</script>
  </head>
  <body data-shell="admin" data-page="projects" data-breadcrumb="Home > Projects">
    <main class="main">
      <div class="page-wrapper">
        <div class="page-header">
          <div class="page-header-row">
            <div>
              <div class="page-pretitle">National Unified Material Master</div>
              <h1 class="page-title">CVC Audit Chain</h1>
            </div>
            <div class="page-actions">
              <button class="btn btn-outline">Filters</button>
              <button class="btn btn-primary">
                <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
                  <path d="M4 8h8M8 4v8" />
                </svg>
                Mint New ONMC
              </button>
            </div>
          </div>
        </div>

        <div class="row col-3" id="projects-grid"></div>
      </div>
    </main>

    <script type="module">
      const projects = [
        [
          'ONMC Tokenization Migration',
          'Dept of Commerce',
          'On track',
          'green',
          'Migrate 2.5M legacy material records to the new ONMC token standard with zero data loss.',
          78,
          'Apr 30',
          ['SK', 'MR', 'EW']
        ],
        [
          'CVC Supply Chain Trace',
          'Global Logistics',
          'At risk',
          'yellow',
          'End-to-end audit chain integration to eliminate counterfeit materials in transit.',
          42,
          'Jun 15',
          ['MK', 'LP', 'DR', 'YT']
        ],
        [
          'Unified Material Ontology',
          'Standards Board',
          'On track',
          'green',
          'Resolve 15,000+ classification conflicts to ensure perfect cross-border compliance.',
          91,
          'May 12',
          ['TH', 'MR']
        ],
        [
          'Defect Recall Automation',
          'Quality Control',
          'On track',
          'green',
          'Automated smart contracts to freeze compromised ONMC tokens within 7 seconds of a recall.',
          33,
          'May 28',
          ['LP', 'EW', 'SK']
        ],
        [
          'Legacy Gateway Sunset',
          'Internal',
          'Blocked',
          'red',
          'Decommission the vulnerable v1 API and force-migrate remaining 316 vendors to v2.',
          18,
          'Jul 02',
          ['DR', 'MK']
        ],
        [
          'ONMC Minting Engine v3',
          'Internal',
          'On track',
          'green',
          'Re-architect the core minting engine to support 10,000+ material tokens per second.',
          64,
          'May 20',
          ['SK', 'EW', 'LP', 'TH']
        ],
        [
          'Audit Chain Explorer',
          'Umbrella Co',
          'On hold',
          'yellow',
          'Public-facing portal for vendors to independently verify ONMC token provenance.',
          5,
          'TBD',
          ['YT', 'MR']
        ],
        [
          'SOC 2 Type II Prep',
          'Internal',
          'On track',
          'green',
          'Lock down all CVC endpoints and finalize compliance evidence for the Q3 external audit.',
          72,
          'Jun 30',
          ['DR', 'TH']
        ],
        [
          'Smart Pricing Oracle',
          'Tyrell Corp',
          'On track',
          'green',
          'Dynamic fee adjustment mechanism based on real-time audit chain network congestion.',
          50,
          'May 05',
          ['LP', 'MK']
        ]
      ];
      const colorMap = {
        primary: 'var(--primary)',
        azure: 'var(--azure)',
        purple: 'var(--purple)',
        yellow: 'var(--yellow)',
        red: 'var(--red)',
        green: 'var(--green)',
        blue: 'var(--blue)'
      };
      const memberColors = {
        SK: 'azure',
        MR: 'purple',
        EW: 'yellow',
        MK: 'red',
        LP: 'green',
        DR: 'blue',
        YT: 'primary',
        TH: 'purple'
      };
      const statusCls = { green: 'status-green', yellow: 'status-yellow', red: 'status-red' };

      const grid = document.getElementById('projects-grid');
      grid.innerHTML = projects
        .map(
          ([title, client, status, sCls, desc, pct, due, members], idx) => `
  <button type="button" class="project-card" data-idx="${idx}">
    <div class="top">
      <div>
        <div class="title">${title}</div>
        <div class="client">${client}</div>
      </div>
      <span class="status ${statusCls[sCls]}">${status}</span>
    </div>
    <div class="desc">${desc}</div>
    <div>
      <div style="display:flex;justify-content:space-between;font-size:11.5px;color:var(--text-muted);margin-bottom:4px">
        <span>Progress</span><span class="cell-strong">${pct}%</span>
      </div>
      <div class="progress-thin"><div class="bar" style="width:${pct}%;background:var(--${sCls === 'red' ? 'red' : sCls === 'yellow' ? 'yellow' : 'primary'})"></div></div>
    </div>
    <div class="footer-row">
      <div class="avatars">
        ${members.map(m => `<div class="av" style="background:${colorMap[memberColors[m] || 'primary']}">${m}</div>`).join('')}
      </div>
      <span>Due ${due}</span>
    </div>
  </button>
`
        )
        .join('');

      // Wire card clicks → detail modal.
      import('/src/v4/details.js').then(({ openProjectModal }) => {
        grid.addEventListener('click', e => {
          const card = e.target.closest('.project-card');
          if (!card) return;
          const idx = parseInt(card.dataset.idx, 10);
          const p = projects[idx];
          if (!p) return;
          const [title, client, status, sCls, desc, pct, due, members] = p;
          openProjectModal({ title, client, status, sCls, desc, pct, due, members });
        });
      });
    </script>
  </body>
</html>
