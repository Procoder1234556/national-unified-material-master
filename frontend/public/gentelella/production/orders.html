<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NUMM Material Master</title>
    <link rel="icon" href="../images/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script type="module">import "/src/main-v4.js";</script>
  </head>
  <body data-shell="admin" data-page="orders" data-breadcrumb="Home > Orders">
    <main class="main">
      <div class="page-wrapper">
        <div class="page-header">
          <div class="page-header-row">
            <div>
              <div class="page-pretitle">Agentic Ecosystem</div>
              <h1 class="page-title">Available Skills</h1>
            </div>
            <div class="page-actions">
              <button class="btn btn-outline">Export JSON</button>
              <button class="btn btn-primary">+ Create Skill</button>
            </div>
          </div>
        </div>

        <!-- Stat row -->
        <div class="row col-3" style="margin-bottom: 16px">
          <div class="card">
            <div class="stat">
              <div class="stat-icon teal">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                  <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z" />
                  <line x1="3" y1="6" x2="21" y2="6" />
                </svg>
              </div>
              <div class="stat-content">
                <div class="stat-label">Total Skills</div>
                <div class="stat-value-row"><span class="stat-value" id="stat-total-skills">-</span></div>
                <div class="stat-subtext">Across all plugins</div>
              </div>
            </div>
          </div>
          <div class="card">
            <div class="stat">
              <div class="stat-icon green">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                  <line x1="12" y1="1" x2="12" y2="23" />
                  <path d="M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6" />
                </svg>
              </div>
              <div class="stat-content">
                <div class="stat-label">.agents Skills</div>
                <div class="stat-value-row"><span class="stat-value" id="stat-agents-skills">-</span></div>
                <div class="stat-subtext">Project local</div>
              </div>
            </div>
          </div>
          <div class="card">
            <div class="stat">
              <div class="stat-icon yellow">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                  <circle cx="12" cy="12" r="10" />
                  <polyline points="12 6 12 12 16 14" />
                </svg>
              </div>
              <div class="stat-content">
                <div class="stat-label">.gemini Skills</div>
                <div class="stat-value-row"><span class="stat-value" id="stat-gemini-skills">-</span></div>
                <div class="stat-subtext">Global / IDE level</div>
              </div>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="card-header">
            <div>
              <div class="card-title">Installed Agent Skills</div>
              <div class="card-subtitle">Tools and capabilities for the IDE</div>
            </div>
            <div class="card-options">
              <label style="font-size: 11.5px; color: var(--text-muted); margin-right: 6px">Status</label>
              <select class="form-control" style="width: 170px; height: 32px" aria-label="Filter by type">
                <option>All Skills</option>
                <option>.agents (Local)</option>
                <option>.gemini (Global)</option>
              </select>
            </div>
          </div>
          <div class="card-body p-0">
            <div class="table-responsive">
              <table class="table" data-datatable data-page-length="10" data-export="orders">
                <thead>
                  <tr>
                    <th>Skill ID</th>
                    <th>Name</th>
                    <th>Description</th>
                    <th>Size</th>
                    <th>Created At</th>
                    <th data-orderable="false"></th>
                  </tr>
                </thead>
                <tbody id="orders-rows"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script type="module">
      const colorMap = {
        primary: 'var(--primary)',
        azure: 'var(--azure)',
        purple: 'var(--purple)',
        yellow: 'var(--yellow)',
        red: 'var(--red)',
        green: 'var(--green)',
        blue: 'var(--blue)'
      };

      const tbody = document.getElementById('orders-rows');

      function formatBytes(bytes, decimals = 2) {
        if (!+bytes) return '0 Bytes';
        const k = 1024;
        const dm = decimals < 0 ? 0 : decimals;
        const sizes = ['Bytes', 'KB', 'MB', 'GB', 'TB', 'PB', 'EB', 'ZB', 'YB'];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return `${parseFloat((bytes / Math.pow(k, i)).toFixed(dm))} ${sizes[i]}`;
      }

      function truncate(str, n) {
        return str.length > n ? str.slice(0, n - 1) + '&hellip;' : str;
      }

      function rowHtml(o) {
        const shortDesc = o.desc && o.desc.length > 2 ? truncate(o.desc, 60) : 'No description provided';
        return `
    <tr>
      <td class="cell-mono"><a href="#" style="color:var(--primary);font-weight:var(--font-weight-medium)">${o.id}</a></td>
      <td><div class="cell-customer"><div class="cell-avatar" style="background:${colorMap[o.avatarColor] || 'var(--primary)'}">${o.initials}</div><span class="cell-strong text-dark" style="cursor:pointer">${o.name}</span></div></td>
      <td style="max-width: 300px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;" title="${o.desc}">${shortDesc}</td>
      <td class="cell-strong">${formatBytes(o.size)}</td>
      <td>${o.createdAt}</td>
      <td><button class="card-opt-btn" aria-label="More"><svg viewBox="0 0 16 16" fill="currentColor"><circle cx="8" cy="3" r="1.2"/><circle cx="8" cy="8" r="1.2"/><circle cx="8" cy="13" r="1.2"/></svg></button></td>
    </tr>`;
      }

      function skeletonRows(n = 5) {
        const cell = '<td><span class="skeleton skeleton-text" style="width:80%"></span></td>';
        return Array.from({ length: n }, () => `<tr>${cell.repeat(6)}</tr>`).join('');
      }

      async function load() {
        tbody.innerHTML = skeletonRows();
        try {
          const res = await fetch('skills_data.json');
          if (!res.ok) throw new Error('Failed to fetch skills data');
          const skills = await res.json();

          document.getElementById('stat-total-skills').innerText = skills.length;
          document.getElementById('stat-agents-skills').innerText = skills.filter(s =>
            s.path.includes('.agents')
          ).length;
          document.getElementById('stat-gemini-skills').innerText = skills.filter(s =>
            s.path.includes('.gemini')
          ).length;

          if (!skills.length) {
            tbody.innerHTML = `<tr><td colspan="6" style="padding:40px;text-align:center;color:var(--text-muted)">No skills found.</td></tr>`;
            return;
          }
          tbody.innerHTML = skills.map(rowHtml).join('');
        } catch (err) {
          tbody.innerHTML = `
      <tr><td colspan="6" style="padding:24px">
        <div class="banner banner-danger">
          <svg class="banner-icon" width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="6"/><path d="M5 5l6 6M11 5l-6 6"/></svg>
          <div class="banner-body"><strong>Failed to load skills.</strong> ${err.message || err}</div>
          <div class="banner-actions"><button class="btn btn-outline btn-sm" id="orders-retry">Retry</button></div>
        </div>
      </td></tr>`;
          document.getElementById('orders-retry')?.addEventListener('click', load);
        }
      }
      load();
    </script>
  </body>
</html>
