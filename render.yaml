services:
  - type: web
    name: numm-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    # Render's $25/month web-service plan (1 CPU / 2 GB RAM).
    plan: 1c-2g
    region: singapore
    healthCheckPath: /api/v1/health
    initialDeployHook: python -m backend.app.db.seed_demo
    autoDeployTrigger: commit
    envVars:
      - key: ENVIRONMENT
        value: demo
      - key: USE_SQLITE
        value: "false"
      - key: ALLOW_DEMO_TOKENS
        value: "true"
      # Explicitly enables idempotent schema/demo-data bootstrap on a fresh
      # Render Postgres database. It never resets existing records.
      - key: SEED_DEMO_DATA
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: numm-postgres
          property: connectionString
      - key: CORS_ORIGINS
        value: '["https://national-unified-material-master.vercel.app", "https://numm-frontend.onrender.com", "http://localhost:5173"]'

  - type: web
    name: numm-frontend
    runtime: static
    region: singapore
    buildCommand: corepack enable && pnpm --dir frontend install --frozen-lockfile && pnpm --dir frontend build
    staticPublishPath: frontend/dist
    autoDeployTrigger: commit
    envVars:
      - key: VITE_API_BASE_URL
        value: https://numm-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: numm-postgres
    plan: basic-256mb
    region: singapore
    databaseName: numm_master
    user: numm_app
